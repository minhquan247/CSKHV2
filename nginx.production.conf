server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name localhost 127.0.0.1 azmedia247.com www.azmedia247.com _;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Cho phép tải lên tệp đính kèm kích thước lên tới 25MB
    client_max_body_size 25M;

    # Tối ưu nén Gzip phục vụ tăng tốc hiệu năng
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # API Backend Reverse Proxy
    location /api/ {
        proxy_pass http://v2-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://v2-backend:8000/api/v1/openapi.json;
    }

    # API Documentation & Schema Shortcuts (/docs, /redoc, /openapi.json)
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://v2-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
